<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A focused academic productivity dashboard for tracking Academic Tasks."
  >
  <title>Student Task Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="task-logic.js" defer></script>
  <script src="notification-logic.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <p class="eyebrow">Academic productivity</p>
      <h1>Student Task Tracker</h1>
      <p class="header-summary">Keep the work for every Course clear and in one place.</p>
    </div>
  </header>

  <main class="container app-layout">
    <section class="panel form-panel" aria-labelledby="add-academic-task-heading">
      <div class="section-heading">
        <p class="eyebrow">New Academic Task</p>
        <h2 id="add-academic-task-heading">Add an Academic Task</h2>
        <p>Record the work you need to complete.</p>
      </div>

      <form id="academic-task-form">
        <div class="form-field">
          <label for="task-title">Task Title</label>
          <input id="task-title" name="title" type="text" maxlength="120" required>
        </div>

        <div class="form-field">
          <label for="task-course">Course</label>
          <input id="task-course" name="course" type="text" maxlength="80" required>
        </div>

        <div class="form-field">
          <label for="task-due-date">Due Date</label>
          <input id="task-due-date" name="dueDate" type="date" required>
        </div>

        <button class="primary-button" type="submit">Add Academic Task</button>
      </form>
    </section>

    <section class="panel task-panel" aria-labelledby="academic-tasks-heading">
      <div class="tasks-heading-row">
        <div class="section-heading">
          <p class="eyebrow">Your workload</p>
          <h2 id="academic-tasks-heading">Academic Tasks</h2>
        </div>
        <span id="task-count" class="task-count">0 Academic Tasks</span>
      </div>

      <div id="task-list" class="task-list"></div>
    </section>
  </main>

  <div id="notification" class="notification" role="status" aria-live="polite"></div>
</body>
</html>
